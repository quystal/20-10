<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT PALETTE / MESSAGE: root vars below + script constants
     ============================================================ */
  :root{
    --bg-1:#1c1030;
    --bg-2:#3a1e4d;
    --gold:#f0c46b;
    --gold-soft:#f9e3ac;
    --coral:#ef7d8a;
    --coral-deep:#d94f63;
    --cream:#fff6ea;
    --text-light:#fdf3e7;
    --plum-card:#2c1a3e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;font-family:'Manrope',sans-serif;color:var(--text-light);}
  body{
    background:radial-gradient(ellipse at 50% -10%, var(--bg-2), var(--bg-1) 65%);
    position:relative;
  }
  .stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}

  /* ---------- twinkling stars ---------- */
  .star{
    position:absolute;
    width:2px;height:2px;
    background:var(--gold-soft);
    border-radius:50%;
    opacity:.5;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

  /* ---------- fairy light swag along top ---------- */
  .lights{position:absolute;top:0;left:0;width:100%;height:120px;z-index:1;pointer-events:none;}
  .bulb{
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px 3px var(--gold-soft);
    animation:glow 1.8s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{opacity:.5;transform:scale(.85);}50%{opacity:1;transform:scale(1.05);}}

  /* ---------- header ---------- */
  .hero-text{
    position:absolute;
    top:9%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    z-index:3;
    transition:opacity .5s ease;
  }
  .hero-text .eyebrow{
    font-size:.7rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
  }
  .hero-text h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(1.8rem,5.6vw,3rem);
    color:var(--cream);
    margin-top:.3rem;
    line-height:1.15;
  }
  .hero-text .sub{
    font-family:'Manrope', sans-serif;
    font-size:.95rem;
    color:var(--gold-soft);
    margin-top:.4rem;
    opacity:.85;
  }

  /* ---------- gift box scene ---------- */
  .box-scene{position:relative;width:min(58vw,260px);height:min(58vw,260px);z-index:2;perspective:900px;}
  .box{
    position:absolute;bottom:0;left:0;width:100%;height:62%;
    cursor:pointer;
  }
  .box-base{
    position:absolute;bottom:0;width:100%;height:100%;
    background:linear-gradient(155deg, var(--coral), var(--coral-deep));
    border-radius:10px;
    box-shadow:0 20px 45px rgba(0,0,0,.45);
  }
  .box-lid{
    position:absolute;
    top:-16%;left:-3%;
    width:106%;height:26%;
    background:linear-gradient(155deg, var(--coral-deep), #b73a4c);
    border-radius:8px;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
    transform-origin:bottom center;
    transition:transform .75s cubic-bezier(.5,-0.3,.3,1.4), opacity .6s ease .1s;
    z-index:3;
  }
  .box.open .box-lid{ transform:translateY(-140%) rotate(-18deg); opacity:0; }

  .ribbon-v, .ribbon-h{
    position:absolute;
    background:var(--gold);
    z-index:2;
    transition:transform .5s ease, opacity .4s ease;
  }
  .ribbon-v{ top:0; left:44%; width:12%; height:100%; }
  .ribbon-h{ top:-16%; left:0; width:100%; height:14%; }
  .box.open .ribbon-v{ transform:translateY(-160%) rotate(8deg); opacity:0; }
  .box.open .ribbon-h{ transform:translateY(-160%) rotate(-6deg); opacity:0; }

  .bow{
    position:absolute;
    top:-30%; left:50%;
    transform:translateX(-50%);
    width:70px; height:40px;
    z-index:4;
    transition:transform .5s ease, opacity .4s ease;
  }
  .bow svg{ width:100%; height:100%; }
  .box.open .bow{ transform:translateX(-50%) translateY(-160%) rotate(20deg); opacity:0; }

  .box-glow{
    position:absolute;
    top:-10%; left:10%;
    width:80%; height:60%;
    background:radial-gradient(circle, rgba(240,196,107,.55), transparent 70%);
    opacity:0;
    transition:opacity .5s ease;
    z-index:0;
    pointer-events:none;
  }
  .box.open .box-glow{ opacity:1; }

  /* ---------- flowers popping from box ---------- */
  .bouquet{
    position:absolute;
    bottom:38%;
    left:50%;
    transform:translateX(-50%);
    width:180px;
    height:160px;
    z-index:3;
    pointer-events:none;
  }
  .flower{
    position:absolute;
    bottom:0;
    width:34px; height:34px;
    opacity:0;
    transform:translateY(20px) scale(.3);
    transition:transform .55s cubic-bezier(.3,1.6,.4,1), opacity .4s ease;
  }
  .box.open .flower{ opacity:1; transform:translateY(0) scale(1); }
  .flower svg{ width:100%; height:100%; }

  /* ---------- confetti ---------- */
  .confetti-piece{
    position:absolute;
    width:6px;height:10px;
    opacity:0;
    z-index:5;
    pointer-events:none;
  }

  .prompt{
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Fraunces', serif;
    font-size:1rem;
    font-style:italic;
    color:var(--gold-soft);
    z-index:3;
    opacity:.9;
    animation:pulse 1.8s ease-in-out infinite;
    cursor:default;
  }
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}

  /* ---------- flip card ---------- */
  .card-scene{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:6;
    perspective:1400px;
  }
  .card-scene.show{ display:flex; }
  .card{
    position:relative;
    width:min(84vw,380px);
    height:min(72vw,320px);
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.4,.1,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .card-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:18px;
    padding:1.8rem 1.6rem;
    display:flex;flex-direction:column;
    box-shadow:0 26px 60px rgba(0,0,0,.5);
  }
  .card-front{
    background:linear-gradient(160deg, var(--plum-card), #1e1230);
    border:1px solid rgba(240,196,107,.35);
    align-items:center;justify-content:center;text-align:center;
  }
  .card-front .cf-eyebrow{
    font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold); font-weight:700;
  }
  .card-front h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7rem;
    color:var(--cream);
    margin-top:.5rem;
  }
  .card-front .cf-hint{
    margin-top:1.2rem;
    font-size:.85rem;
    color:var(--gold-soft);
    opacity:.8;
  }
  .card-back{
    background:linear-gradient(160deg, var(--cream), #ffe9cf);
    color:#3a2115;
    transform:rotateY(180deg);
    overflow-y:auto;
  }
  .card-back .eyebrow{
    font-size:.65rem;letter-spacing:.26em;text-transform:uppercase;
    color:var(--coral-deep); font-weight:700; text-align:center;
  }
  .card-back h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    text-align:center;
    margin:.35rem 0 .9rem;
    color:var(--coral-deep);
  }
  .card-back .letter-body{
    font-family:'Fraunces', serif;
    font-size:1.08rem;
    line-height:1.6;
    min-height:6rem;
  }
  .card-back .letter-body .cursor{
    display:inline-block;width:2px;height:1em;background:var(--coral-deep);
    margin-left:2px;vertical-align:middle;animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .card-back .sign{
    margin-top:1.1rem;text-align:right;font-style:italic;color:var(--coral-deep);
  }
  .card-close{
    position:absolute;top:.8rem;right:1rem;
    background:none;border:none;font-size:1.3rem;color:var(--coral-deep);
    cursor:pointer; z-index:2;
  }


  /* ================= YRC touches ================= */
  :root{ --yrc-red:#d63a20; --yrc-amber:#e2a13a; --yrc-ink:#1a1a1d; }
  .yrc-logo{
    width:46px;height:46px;border-radius:50%;
    border:2px solid var(--gold);
    box-shadow:0 0 14px rgba(240,196,107,.45);
    display:block;margin:0 auto .55rem;
    animation:logo-bob 4.5s ease-in-out infinite;
  }
  @keyframes logo-bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-4px) rotate(3deg);}}

  .capy{
    position:absolute;
    left:-46%;bottom:-2%;
    width:34%;
    z-index:4;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));
    animation:capy-bob 3.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes capy-bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(2deg);}}
  .capy-bubble{
    position:absolute;
    left:-52%;bottom:46%;
    background:var(--cream);color:var(--yrc-ink);
    font-size:12px;font-weight:700;
    padding:6px 12px;border-radius:14px;
    white-space:nowrap;z-index:5;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    pointer-events:none;
  }
  .capy-bubble::after{
    content:"";position:absolute;left:22px;bottom:-6px;
    width:12px;height:12px;background:inherit;transform:rotate(45deg);
  }

  .yrc-ticker{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--yrc-ink);color:var(--cream);
    font-size:12px;font-weight:700;letter-spacing:.04em;
    padding:8px 0;overflow:hidden;white-space:nowrap;z-index:8;
    border-top:2px solid var(--yrc-red);
  }
  .yrc-ticker__track{display:inline-block;padding-left:100%;animation:ticker 28s linear infinite;}
  .yrc-ticker__track span{margin-right:44px;}
  .yrc-ticker__track b{color:var(--yrc-amber);}
  @keyframes ticker{to{transform:translateX(-100%);}}

  .card-back .sign{display:flex;align-items:center;justify-content:flex-end;gap:.55rem;opacity:0;transition:opacity .6s ease;}
  .card-back .sign.show{opacity:1;}
  .sign-logo{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--coral-deep);}
  .sign-text{font-style:italic;color:var(--coral-deep);text-align:right;line-height:1.3;}
  .sign-text small{display:block;font-style:normal;font-weight:700;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#3a2115;opacity:.7;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }

  /* ===== STICKER PARTY ===== */
  .stk{position:fixed;left:0;top:0;width:clamp(72px,17vw,130px);z-index:7;cursor:grab;touch-action:none;user-select:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));}
  .stk:active{cursor:grabbing;}
  .stk img{width:100%;display:block;pointer-events:none;animation:stkbob 3s ease-in-out infinite;animation-delay:var(--d);}
  @keyframes stkbob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-8px) rotate(4deg);}}
  .stk-bubble{position:fixed;z-index:10;background:var(--cream);color:var(--yrc-ink);font-size:13px;font-weight:700;padding:7px 12px;border-radius:14px;white-space:nowrap;box-shadow:0 6px 14px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .2s;}
  .stk-bubble.on{opacity:1;}
  .rain-btn{position:fixed;right:12px;bottom:16px;z-index:9;display:none;border:0;border-radius:999px;padding:9px 16px;font:700 13px Manrope,sans-serif;color:#1a1a1d;background:linear-gradient(135deg,var(--gold),var(--coral));box-shadow:0 6px 16px rgba(0,0,0,.4);cursor:pointer;animation:pulse 1.8s ease-in-out infinite;}
  .rain-btn.show{display:block;}
  .rain-piece{position:fixed;top:0;z-index:7;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));}
</style>
</head>

<script>
/* ============================================================
   CUSTOMIZE YOUR CARD HERE
   ============================================================ */
const RECIPIENT = "YRCERS";
const MESSAGE   = "Nhân ngày Phụ nữ Việt Nam 20/10, chúc các Capycon luôn rạng rỡ, " +
                   "tự tin và hạnh phúc trên chặng đường đồng hành cùng CLB trong thời gian tới. Cảm ơn vì đã là một phần của tổ ấm YRC!";
const SIGN_OFF  = "Thân mến 🌸";

/* ---------- stars ---------- */
const starHost = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top = Math.random() * 70 + 'vh';
  s.style.animationDuration = (2 + Math.random() * 3) + 's';
  s.style.animationDelay = (Math.random() * 4) + 's';
  starHost.appendChild(s);
}

/* ---------- fairy lights swag ---------- */
const lightHost = document.getElementById('lights');
const bulbCount = 22;
for (let i = 0; i < bulbCount; i++) {
  const b = document.createElement('div');
  b.className = 'bulb';
  const x = (i / (bulbCount - 1)) * 100;
  const sag = Math.sin((i / (bulbCount - 1)) * Math.PI) * 46;
  b.style.left = x + 'vw';
  b.style.top = (10 + sag) + 'px';
  b.style.animationDelay = (i * 0.12) + 's';
  lightHost.appendChild(b);
}

/* ---------- flowers for bouquet ---------- */
const flowerColors = [
  ['#f0c46b','#d94f63'], ['#ef7d8a','#f9e3ac'], ['#f9e3ac','#ef7d8a'],
  ['#d94f63','#f0c46b'], ['#f0c46b','#ef7d8a']
];
const bouquetHost = document.getElementById('bouquet');
const flowerPositions = [
  {left:'10%', delay:.05}, {left:'32%', delay:.18}, {left:'55%', delay:.1},
  {left:'75%', delay:.24}, {left:'44%', delay:0}
];
flowerPositions.forEach((pos, i) => {
  const [petal, center] = flowerColors[i % flowerColors.length];
  const f = document.createElement('div');
  f.className = 'flower';
  f.style.left = pos.left;
  f.style.transitionDelay = pos.delay + 's';
  f.innerHTML = `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <g fill="${petal}">
        <circle cx="20" cy="10" r="8"/><circle cx="20" cy="30" r="8"/>
        <circle cx="10" cy="20" r="8"/><circle cx="30" cy="20" r="8"/>
      </g>
      <circle cx="20" cy="20" r="7" fill="${center}"/>
    </svg>`;
  bouquetHost.appendChild(f);
});

/* ---------- confetti burst ---------- */
function burstConfetti(originX, originY) {
  const colors = ['#f0c46b','#ef7d8a','#f9e3ac','#d94f63','#fff6ea'];
  for (let i = 0; i < 26; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = originX + 'px';
    c.style.top = originY + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(c);
    const angle = Math.random() * Math.PI * 2;
    const dist = 70 + Math.random() * 140;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 40;
    const rot = Math.random() * 500 - 250;
    c.animate([
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy + 220}px) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 1200 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    setTimeout(() => c.remove(), 1800);
  }
}

/* ---------- box click → open ---------- */
const box = document.getElementById('box');
const boxScene = document.getElementById('boxScene');
const heroText = document.getElementById('heroText');
const prompt = document.getElementById('prompt');
const cardScene = document.getElementById('cardScene');

box.addEventListener('click', () => {
  if (box.classList.contains('open')) return;
  box.classList.add('open');
  const rect = box.getBoundingClientRect();
  burstConfetti(rect.left + rect.width / 2, rect.top);
  prompt.textContent = '✦ đang mở quà... ✦';
  document.getElementById('capyBubble').textContent = 'Quà đây nè!';

  setTimeout(() => {
    boxScene.style.transition = 'opacity .5s ease, transform .5s ease';
    boxScene.style.opacity = '0';
    boxScene.style.transform = 'scale(.85)';
    heroText.style.opacity = '0';
    prompt.style.opacity = '0';
    setTimeout(() => cardScene.classList.add('show'), 400);
  }, 1300);
});

/* ---------- card flip + typing ---------- */
const card = document.getElementById('card');
const cardTitle = document.getElementById('cardTitle');
const letterBody = document.getElementById('letterBody');
const letterSign = document.getElementById('letterSign');
const cardClose = document.getElementById('cardClose');
let typingTimer = null;

function typeMessage() {
  letterBody.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  clearInterval(typingTimer);
  typingTimer = setInterval(() => {
    if (i < MESSAGE.length) {
      letterBody.innerHTML = MESSAGE.slice(0, ++i) + '<span class="cursor"></span>';
    } else {
      clearInterval(typingTimer);
      document.getElementById('signText').textContent = SIGN_OFF;
      letterSign.classList.add('show');
    }
  }, 26);
}

card.addEventListener('click', (e) => {
  if (e.target === cardClose) return;
  if (!card.classList.contains('flipped')) {
    card.classList.add('flipped');
    cardTitle.textContent = 'Gửi ' + RECIPIENT + '!';
    setTimeout(typeMessage, 500);
  }
});

cardClose.addEventListener('click', (e) => {
  e.stopPropagation();
  cardScene.classList.remove('show');
  card.classList.remove('flipped');
  clearInterval(typingTimer);
  letterSign.classList.remove('show');
  document.getElementById('signText').textContent = '';
  document.getElementById('capyBubble').textContent = 'Chúc mừng 20/10 nha~';
  box.classList.remove('open');
  boxScene.style.opacity = '1';
  boxScene.style.transform = 'scale(1)';
  heroText.style.opacity = '1';
  prompt.style.opacity = '.9';
  prompt.textContent = '✦ nhấn vào hộp quà ✦';

const rainBtn=document.getElementById('rainBtn'), bubble=document.getElementById('stkBubble');
let stkEls=[], stkDone=false, bubTimer=null;

function popSticker(el,say){
  const r=el.getBoundingClientRect();
  burstConfetti(r.left+r.width/2, r.top+r.height/2);
  el.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.4) rotate(-14deg)'},{transform:'scale(.9) rotate(10deg)'},{transform:'scale(1) rotate(0)'}],{duration:520,easing:'ease-out'});
  bubble.textContent=say; bubble.classList.add('on');
  const bw=bubble.offsetWidth;
  bubble.style.left=Math.max(8,Math.min(innerWidth-bw-8,r.left+r.width/2-bw/2))+'px';
  bubble.style.top=Math.max(8,r.top-44)+'px';
  clearTimeout(bubTimer); bubTimer=setTimeout(()=>bubble.classList.remove('on'),1900);
}
function makeDraggable(el,say){
  let sx,sy,ox,oy,moved=false;
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;moved=false;});
  el.addEventListener('pointermove',e=>{
    if(!el.hasPointerCapture(e.pointerId))return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    if(moved){el.style.left=(ox+dx)+'px';el.style.top=(oy+dy)+'px';}
  });
  el.addEventListener('pointerup',()=>{ if(!moved) popSticker(el,say); });
}
function spawnStickers(){
  const rect=box.getBoundingClientRect(), ox=rect.left+rect.width/2, oy=rect.top;
  STK.forEach((s,i)=>{
    const el=document.createElement('div'); el.className='stk';
    el.innerHTML='<img alt="sticker" src="'+s.src+'">'; el.style.setProperty('--d',(-i*.4)+'s');
    document.body.appendChild(el);
    const w=el.offsetWidth, ang=(i/STK.length)*Math.PI*2-Math.PI/2+Math.PI/STK.length;
    const tx=innerWidth/2+Math.cos(ang)*((innerWidth-w)/2-8)-w/2, ty=innerHeight/2+Math.sin(ang)*((innerHeight-w)/2-14)-w/2;
    el.style.left=tx+'px'; el.style.top=ty+'px';
    el.animate([{transform:'translate('+(ox-tx-w/2)+'px,'+(oy-ty-w/2)+'px) scale(.1) rotate('+(Math.random()*720-360)+'deg)',opacity:0},{opacity:1,offset:.2},{transform:'none',opacity:1}],{duration:1000,delay:i*90,easing:'cubic-bezier(.2,1.3,.4,1)',fill:'backwards'});
    makeDraggable(el,s.say); stkEls.push(el);
  });
  rainBtn.classList.add('show');
}
function rainStickers(){
  for(let i=0;i<26;i++){
    const img=document.createElement('img'); img.className='rain-piece'; img.src=STK[i%STK.length].src;
    const w=55+Math.random()*60; img.style.width=w+'px'; img.style.left=(Math.random()*(innerWidth-w))+'px';
    document.body.appendChild(img);
    const rot=Math.random()*600-300, dur=2400+Math.random()*2200;
    img.animate([{transform:'translateY(-160px) rotate(0)'},{transform:'translateY('+(innerHeight+160)+'px) rotate('+rot+'deg)'}],{duration:dur,delay:Math.random()*1200,easing:'cubic-bezier(.4,0,.8,.6)',fill:'both'}).onfinish=()=>img.remove();
  }
}
rainBtn.addEventListener('click',rainStickers);
box.addEventListener('click',()=>{ if(stkDone)return; stkDone=true; setTimeout(spawnStickers,350); });
cardClose.addEventListener('click',()=>{
  stkEls.forEach(e=>e.remove()); stkEls=[]; stkDone=false; rainBtn.classList.remove('show'); bubble.classList.remove('on');
});
</script>
